name: NG.Cash
description: >-
  NG.CASH is a Brazilian digital banking platform built for the new generation
  (roughly ages 12 to 30), founded in 2021 and headquartered in Rio de Janeiro.
  Authorized by Brazil's Central Bank as a payment institution and electronic
  currency issuer, it offers a digital account with Pix instant payments, a
  personalized Mastercard prepaid and virtual card, bill payment, mobile
  top-ups, a savings feature ("Cofrinho"), allowance management, and a discount
  marketplace, plus credit products offered as a banking correspondent through
  partners such as BTG Pactual and QI SCD. NG.CASH is a consumer-facing mobile
  application (iOS and Android) with over three million active accounts; it
  publishes no public developer API, developer portal, or OpenAPI specification.
  This profile was surfaced as a portfolio company of a16z and enriched by the
  API Evangelist network from public sources.
